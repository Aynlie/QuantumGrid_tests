<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuantumGrid Optimisation Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1 class="title">QuantumGrid Optimisation</h1>
    <button id="runBtn" class="btn primary">Run optimisation</button>
    <div id="loader" class="loader hidden"></div>
    <section id="result" class="result hidden">
      <h2>Result</h2>
      <pre id="output" class="output"></pre>
    </section>
  </main>

  <script>
    const runBtn = document.getElementById('runBtn');
    const loader = document.getElementById('loader');
    const resultSection = document.getElementById('result');
    const output = document.getElementById('output');

    const apiUrl = 'http://localhost:8000/run-optimization'; // adjust if deployed elsewhere

    runBtn.addEventListener('click', async () => {
      // UI feedback
      runBtn.disabled = true;
      loader.classList.remove('hidden');
      resultSection.classList.add('hidden');
      output.textContent = '';

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({}) // use defaults
        });
        if (!response.ok) throw new Error(`Server error ${response.status}`);
        const data = await response.json();
        output.textContent = JSON.stringify(data, null, 2);
        resultSection.classList.remove('hidden');
      } catch (e) {
        output.textContent = `❌ ${e.message}`;
        resultSection.classList.remove('hidden');
      } finally {
        loader.classList.add('hidden');
        runBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
